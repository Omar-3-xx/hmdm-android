name: patch-launcher

# Rebuild the Phoenix rep-tablet launcher by patching the proven 6.48 binary, because its source is
# gone (the old fork's account is suspended). Modes:
#   inspect       - decompile 6.48 and print/upload the smali we must edit.
#   build-unsigned- apply the two edits + rebuild, prove it compiles; upload the UNSIGNED apk. No key.
#   build         - the above + re-sign with the Phoenix key (from secrets) + publish a release.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | build-unsigned | verify-key | build"
        required: true
        default: inspect
        type: choice
        options: [inspect, build-unsigned, verify-key, build]
      source_tag:
        description: "release tag holding the APK to patch"
        required: true
        default: launcher-6.48-r1
      new_version_name:
        description: "version name for the build (e.g. 6.50) - the version code is derived from it"
        required: true
        default: "6.51"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install apktool
        run: |
          set -euxo pipefail
          curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          printf '#!/usr/bin/env bash\njava -jar %s/apktool.jar "$@"\n' "$PWD" | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Download the source APK from its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release download "${{ inputs.source_tag }}" --repo "${{ github.repository }}" --pattern '*.apk' --dir .
          ls -l *.apk
          cp -- *.apk source.apk

      - name: Decompile
        run: |
          set -euxo pipefail
          apktool d -f -o out source.apk
          grep -iE 'version' out/apktool.yml || true

      # ---------------- INSPECT ----------------
      - name: INSPECT — locate the edit targets
        if: ${{ inputs.mode == 'inspect' }}
        run: |
          set -uxo pipefail
          cd out
          echo "===== owner-info / lock-screen string ====="
          grep -rn --include='*.smali' "Sato Pharma" smali* 2>/dev/null || true
          echo "===== setDeviceOwnerLockScreenInfo / setOrganizationName ====="
          grep -rn --include='*.smali' "setDeviceOwnerLockScreenInfo\|setOrganizationName" smali* 2>/dev/null || true
          echo "===== setStatusBarDisabled ====="
          grep -rn --include='*.smali' "setStatusBarDisabled" smali* 2>/dev/null || true
          echo "===== StatusBarOverlayService ====="
          grep -rn --include='*.smali' "StatusBarOverlayService" smali* 2>/dev/null || true
          mkdir -p /tmp/hits
          grep -rl --include='*.smali' -e "Sato Pharma" -e "setStatusBarDisabled" -e "StatusBarOverlayService" -e "setDeviceOwnerLockScreenInfo" smali* 2>/dev/null | sort -u | while read -r f; do
            cp -- "$f" "/tmp/hits/$(echo "$f" | tr '/' '_')" || true
          done
          cp apktool.yml /tmp/hits/apktool.yml || true
          ls -l /tmp/hits || true
      - name: INSPECT — the push-notification notice (6.51)
        if: ${{ inputs.mode == 'inspect' }}
        run: |
          set -uxo pipefail
          cd out
          echo "===== string resource ====="
          grep -rn "Push notifications are active" res/values/strings.xml || true
          N="$(grep -o 'name="[^"]*">Push notifications are active' res/values/strings.xml | sed 's/name="//;s/">.*//' | head -1)"
          echo "resource name: $N"
          grep -n "\"$N\"" res/values/public.xml || true
          ID="$(grep "name=\"$N\"" res/values/public.xml | grep -o 'id="0x[0-9a-f]*"' | sed 's/id="//;s/"//')"
          echo "resource id: $ID"
          echo "===== who uses it ====="
          grep -rln --include='*.smali' "$ID" smali* || true
          echo "===== setForegroundService / startForeground / startForegroundService ====="
          grep -rn --include='*.smali' -e "setForegroundService" -e "->startForeground(" -e "startForegroundService" smali* | grep -v '/androidx/' | head -40 || true
          echo "===== NotificationChannel constructions outside libraries ====="
          grep -rn --include='*.smali' "Landroid/app/NotificationChannel;-><init>" smali*/com/hmdm smali*/org/eclipse 2>/dev/null | head -20 || true
          echo "===== push option strings ====="
          grep -rn --include='*.smali' -e '"mqttWorker"' -e '"mqttAlarm"' -e '"polling"' -e '"longPolling"' smali* | head -20 || true
          echo "===== Push notifications enqueued ====="
          grep -rn --include='*.smali' "Push notifications enqueued" smali* | head || true
          mkdir -p /tmp/hits/push
          for f in $(grep -rln --include='*.smali' -e "$ID" -e "setForegroundService" -e "Push notifications enqueued" -e '"mqttWorker"' smali*/com/hmdm smali*/org/eclipse 2>/dev/null | sort -u); do cp -- "$f" "/tmp/hits/push/$(echo "$f" | tr '/' '_')"; done
          for f in $(ls smali*/org/eclipse/paho/android/service/MqttService.smali smali*/org/eclipse/paho/android/service/MqttAndroidClient.smali 2>/dev/null); do cp -- "$f" "/tmp/hits/push/$(echo "$f" | tr '/' '_')"; done
          ls -l /tmp/hits/push
      - name: INSPECT — how app versions are compared
        if: ${{ inputs.mode == 'inspect' }}
        run: |
          set -uxo pipefail
          cd out
          F="$(grep -rl --include='*.smali' "Downgrade requested" smali* | head -3)"
          echo "$F"
          mkdir -p /tmp/hits/ver
          for f in $F; do cp -- "$f" "/tmp/hits/ver/$(echo "$f" | tr '/' '_')"; done
          for f in $F; do grep -n -B60 -A10 "Downgrade requested" "$f" | grep -E "invoke|const-string|if-|getCode|versionCode|getVersion" | head -60; done
      - name: Upload the smali to edit
        if: ${{ inputs.mode == 'inspect' }}
        uses: actions/upload-artifact@v4
        with: { name: smali-to-edit, path: /tmp/hits, if-no-files-found: warn }

      # ---------------- VERIFY-KEY (fast: does the stored password open the keystore?) ----------------
      - name: Verify the signing key
        if: ${{ inputs.mode == 'verify-key' }}
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -uo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then echo "::error::SIGNING_KEYSTORE_B64 is empty"; exit 1; fi
          echo "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > ks.p12
          echo "keystore file bytes: $(wc -c < ks.p12)"
          SP="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          echo "stored keystore-password length (after trim): ${#SP}"
          if keytool -list -keystore ks.p12 -storetype PKCS12 -storepass "$SP" >aliases.txt 2>err.txt; then
            echo "OK: the stored keystore password opens the keystore."
            echo "---- aliases in the keystore (compare to SIGNING_KEY_ALIAS) ----"
            grep -i "alias name" aliases.txt || cat aliases.txt | head
            echo "SIGNING_KEY_ALIAS (trimmed) = [$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')]"
          else
            echo "::error::the stored SIGNING_KEYSTORE_PASSWORD does NOT open the keystore"
            head -3 err.txt
            exit 1
          fi
          rm -f ks.p12

      # ---------------- BUILD (signed or unsigned) ----------------
      - name: Apply the two edits
        if: ${{ inputs.mode == 'build' || inputs.mode == 'build-unsigned' }}
        run: bash scripts/apply-patches.sh out "${{ inputs.new_version_name }}"

      - name: Rebuild
        if: ${{ inputs.mode == 'build' || inputs.mode == 'build-unsigned' }}
        run: |
          set -euxo pipefail
          apktool b out -o unsigned.apk
          ls -l unsigned.apk

      - name: Verify the edits landed in the rebuilt apk
        if: ${{ inputs.mode == 'build' || inputs.mode == 'build-unsigned' }}
        run: |
          set -euxo pipefail
          apktool d -f -o verify unsigned.apk
          echo "----- new lock-screen line present? -----"
          grep -rn --include='*.smali' -F "This device is not private. It belongs to Sato Pharma." verify/smali* | head
          echo "----- old line gone? (must be empty) -----"
          if grep -rn --include='*.smali' -F "This device belongs to Sato Pharma" verify/smali*; then echo "::error::old line still present"; exit 1; fi
          echo "----- status-bar disable neutered? (const/4 p1, 0x0 right before the DPM call) -----"
          U=verify/smali/com/hmdm/launcher/util/Utils.smali
          grep -n -B3 "DevicePolicyManager;->setStatusBarDisabled" "$U" | head
          awk '/DevicePolicyManager;->setStatusBarDisabled\(Landroid\/content\/ComponentName;Z\)Z/{ if (prev ~ /const\/4 p1, 0x0/) {print "OK: disable forced false"; found=1} } { if ($0 !~ /^[[:space:]]*$/) prev=$0 } END{ if(!found){print "::error::const/4 p1, 0x0 not immediately before the DPM setStatusBarDisabled call"; exit 1} }' "$U"
          echo "----- overlay start skipped? (a goto immediately follows the setStatusBarDisabled call-site) -----"
          I=verify/smali/com/hmdm/launcher/helper/Initializer.smali
          awk 'f && $0 !~ /^[[:space:]]*$/ { if ($0 ~ /^[[:space:]]*goto /) {print "OK: overlay start skipped by",$0; ok=1} else {print "::error::expected a goto right after the setStatusBarDisabled call-site, got:",$0; exit 1}; f=0 } /invoke-static \{p0, v4\}, Lcom\/hmdm\/launcher\/util\/Utils;->setStatusBarDisabled\(Landroid\/content\/Context;Z\)V/{ f=1 } END{ if(!ok){print "::error::setStatusBarDisabled call-site not found in Initializer"; exit 1} }' "$I"

      - name: Verify the 6.50 edits landed (RustDesk quiet, no status-bar touch blocker)
        if: ${{ inputs.mode == 'build' || inputs.mode == 'build-unsigned' }}
        run: |
          set -euxo pipefail
          U=verify/smali/com/hmdm/launcher/util/Utils.smali
          awk '$0==".method public static startRemoteAccessApp(Landroid/content/Context;Ljava/lang/String;)V"{m=1;next} m&&/^[[:space:]]*\.locals/{w=1;next} w&&$0!~/^[[:space:]]*$/{l=$0;gsub(/^[[:space:]]+/,"",l); if(l=="return-void"){print "OK: RustDesk auto-open neutered"; ok=1}; w=0;m=0} END{if(!ok){print "::error::startRemoteAccessApp still runs"; exit 1}}' "$U"
          P="$(grep -rlE '^\.method .*static .*preventStatusBarExpansion\(' verify/smali* | head -1)"
          awk '/^\.method .*static .*preventStatusBarExpansion\(/{m=1;next} m&&/^[[:space:]]*\.locals/{w=1;next} w&&$0!~/^[[:space:]]*$/{l=$0;gsub(/^[[:space:]]+/,"",l); if(l=="const/4 p0, 0x0"){print "OK: status-bar touch blocker returns null"; ok=1}; w=0;m=0} END{if(!ok){print "::error::preventStatusBarExpansion still draws"; exit 1}}' "$P"
          A="$(grep -rlE '^\.method public clearRestrictions\(Landroid/view/View;\)V$' verify/smali* | head -1)"
          awk '/^\.method public clearRestrictions\(/{m=1} m&&/const-string v0, "no_debugging_features"/{s=1} m&&s&&/unlockUserRestrictions/{print "OK: admin panel lifts the debugging block"; ok=1; exit} m&&/^\.end method/{exit} END{if(!ok){print "::error::clearRestrictions does not lift no_debugging_features"; exit 1}}' "$A"
          grep -E "versionCode|versionName" out/apktool.yml

      - name: Verify the 6.51 edit landed (push notice quiet)
        if: ${{ inputs.mode == 'build' || inputs.mode == 'build-unsigned' }}
        run: |
          set -euxo pipefail
          P=verify/smali/com/hmdm/launcher/service/PushLongPollingService.smali
          awk '$0==".method private startAsForeground()V"{m=1} m&&/^\.end method/{exit} m&&/NotificationChannel;-><init>/{ if (prev ~ /const\/4 v[0-9]+, 0x2$/) {print "OK: push channel is LOW"; ok=1} else {print "::error::push channel not LOW, got:",prev; exit 1} } m&&$0!~/^[[:space:]]*$/&&$0!~/^[[:space:]]*\.line/{prev=$0} END{if(!ok){print "::error::push channel init not found"; exit 1}}' "$P"
          grep -n 'name="mqtt_service_text"' verify/res/values/strings.xml
          grep -q '<string name="mqtt_service_text">Sato Pharma</string>' verify/res/values/strings.xml
          if grep -rn "Push notifications are active" verify/res/values*/strings.xml; then echo "::error::old notice text still present"; exit 1; fi
          echo "OK: notice reads Sato Pharma"

      - name: Zipalign
        if: ${{ inputs.mode == 'build' || inputs.mode == 'build-unsigned' }}
        run: |
          set -euxo pipefail
          ALIGN="$(ls $ANDROID_HOME/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)"
          "$ALIGN" -f 4 unsigned.apk aligned.apk
          ls -l aligned.apk

      - name: Upload UNSIGNED apk (build-unsigned only)
        if: ${{ inputs.mode == 'build-unsigned' }}
        uses: actions/upload-artifact@v4
        with: { name: unsigned-apk, path: aligned.apk, if-no-files-found: error }

      - name: Sign + publish (build only)
        if: ${{ inputs.mode == 'build' }}
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then echo "::error::signing secrets not set — add SIGNING_KEYSTORE_B64 / _PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD"; exit 1; fi
          # Windows PowerShell piping Read-Host into `gh secret set` can append a CR/LF to the value.
          # Strip any trailing newline/CR from the text secrets (a password/alias never ends in one).
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          set -x
          V="${{ inputs.new_version_name }}"
          SIGNER="$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          echo "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > ks.p12
          "$SIGNER" sign --ks ks.p12 --ks-type PKCS12 --ks-pass "pass:${KEYSTORE_PASSWORD}" --ks-key-alias "${KEY_ALIAS}" --key-pass "pass:${KEY_PASSWORD}" --out "hmdm-phoenix-${V}.apk" aligned.apk
          rm -f ks.p12
          "$SIGNER" verify --print-certs "hmdm-phoenix-${V}.apk"
          # CRITICAL: the new app MUST carry the SAME signing certificate as the one on the tablets today
          # (source.apk = the fleet's 6.48), or no tablet can update in place.
          NEWC="$("$SIGNER" verify --print-certs "hmdm-phoenix-${V}.apk" | grep -i 'SHA-256' | head -1)"
          OLDC="$("$SIGNER" verify --print-certs source.apk | grep -i 'SHA-256' | head -1)"
          echo "new cert: $NEWC"; echo "old cert: $OLDC"
          if [ -z "$NEWC" ] || [ "$NEWC" != "$OLDC" ]; then echo "::error::signing certificate does NOT match the fleet's 6.48 — publishing refused (tablets could not update in place)"; exit 1; fi
          echo "signing certificate matches the fleet — safe to ship"
          sha256sum "hmdm-phoenix-${V}.apk"
          gh release create "launcher-${V}-r1" "hmdm-phoenix-${V}.apk" --repo "${{ github.repository }}" --title "launcher ${V}" --notes "Patched from ${{ inputs.source_tag }}: lock-screen line, pull-down restored (all three blockers), RustDesk never auto-opens, debugging via the admin panel, quiet push notice. Signed with the Phoenix key." \
            || gh release upload "launcher-${V}-r1" "hmdm-phoenix-${V}.apk" --repo "${{ github.repository }}" --clobber
